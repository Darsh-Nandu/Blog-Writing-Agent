<svg width="100%" viewBox="0 0 680 920" role="img" xmlns="http://www.w3.org/2000/svg">
<title>BWA 4.0 — Full Pipeline Architecture</title>
<desc>Flowchart showing the Blog Writing Agent v4.0 pipeline: Topic input flows through Router Node, HITL Checkpoint 1, Research Node, Orchestrator Node, HITL Checkpoint 2, parallel Worker Nodes via LangGraph fan-out, and finally a Reducer Node producing blog.md</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .t  { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 14px; fill: #cbd2dc; }
    .ts { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 12px; fill: #7c8493; }
    .th { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #f0f2f5; }
    .tlabel { font-family: -apple-system, 'Segoe UI', sans-serif; font-size: 11px; fill: #a78bfa; font-weight: 600; letter-spacing: 0.06em; }
    .arr { stroke: #4b5563; stroke-width: 1.5; fill: none; }
    .arr-purple { stroke: #7c3aed; stroke-width: 1.5; fill: none; }
    .arr-amber  { stroke: #d97706; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
  </style>
</defs>

<!-- ── Background ── -->
<rect width="680" height="920" fill="#0c0e14"/>

<!-- ── Title ── -->
<text x="340" y="36" text-anchor="middle" class="th" style="font-size:16px;fill:#f8fafc;letter-spacing:-0.01em">BWA 4.0 — Full Pipeline</text>
<line x1="60" y1="50" x2="620" y2="50" stroke="#23262f" stroke-width="0.5"/>

<!-- ═══════════════════════════════════════
     ROW 1: TOPIC INPUT
     ═══════════════════════════════════════ -->
<!-- Input pill -->
<rect x="244" y="68" width="192" height="44" rx="22" fill="#1c1f2b" stroke="#6366f1" stroke-width="1.5"/>
<text x="340" y="90" text-anchor="middle" class="th" dominant-baseline="central">✦  Blog Topic</text>
<text x="340" y="106" text-anchor="middle" class="ts" dominant-baseline="central">e.g. "State of LLMs in 2026"</text>

<!-- Arrow down -->
<line x1="340" y1="112" x2="340" y2="138" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     ROW 2: ROUTER NODE
     ═══════════════════════════════════════ -->
<rect x="205" y="140" width="270" height="66" rx="12" fill="#14161e" stroke="#6366f1" stroke-width="1"/>
<rect x="205" y="140" width="4" height="66" rx="2" fill="#6366f1"/>
<text x="228" y="164" class="th" dominant-baseline="central">🧭  Router Node</text>
<text x="228" y="184" class="ts" dominant-baseline="central">Classifies topic → picks research mode</text>
<!-- Outputs label right -->
<text x="485" y="162" class="ts">RouterDecision</text>
<text x="485" y="178" class="ts" style="fill:#a78bfa">(Pydantic)</text>
<line x1="475" y1="170" x2="493" y2="170" class="arr-purple" marker-end="url(#arrow)"/>

<!-- 3 mode chips below router -->
<rect x="162" y="218" width="96" height="28" rx="14" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="0.5"/>
<text x="210" y="232" text-anchor="middle" class="ts" style="fill:#93c5fd;font-size:11px" dominant-baseline="central">🌐 open_book</text>

<rect x="282" y="218" width="76" height="28" rx="14" fill="rgba(16,185,129,0.10)" stroke="rgba(16,185,129,0.25)" stroke-width="0.5"/>
<text x="320" y="232" text-anchor="middle" class="ts" style="fill:#6ee7b7;font-size:11px" dominant-baseline="central">🔀 hybrid</text>

<rect x="382" y="218" width="96" height="28" rx="14" fill="rgba(148,163,184,0.10)" stroke="rgba(148,163,184,0.2)" stroke-width="0.5"/>
<text x="430" y="232" text-anchor="middle" class="ts" style="fill:#cbd5e1;font-size:11px" dominant-baseline="central">📚 closed_book</text>

<!-- Arrow down -->
<line x1="340" y1="246" x2="340" y2="270" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     ROW 3: HITL CHECKPOINT 1
     ═══════════════════════════════════════ -->
<rect x="120" y="272" width="440" height="58" rx="10" fill="#1a140a" stroke="#d97706" stroke-width="1"/>
<rect x="120" y="272" width="440" height="4" rx="2" fill="#d97706"/>
<text x="340" y="299" text-anchor="middle" class="th" dominant-baseline="central" style="fill:#fbbf24">🛑  Checkpoint 1 of 2 — Review Research Strategy</text>
<text x="340" y="318" text-anchor="middle" class="ts" dominant-baseline="central">Approve mode + search queries  ·  Add optional feedback  ·  Or go back</text>

<!-- Arrow down -->
<line x1="340" y1="330" x2="340" y2="354" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     ROW 4: RESEARCH NODE (conditional)
     ═══════════════════════════════════════ -->
<rect x="205" y="356" width="270" height="66" rx="12" fill="#14161e" stroke="#3b82f6" stroke-width="1"/>
<rect x="205" y="356" width="4" height="66" rx="2" fill="#3b82f6"/>
<text x="228" y="380" class="th" dominant-baseline="central">🔍  Research Node</text>
<text x="228" y="400" class="ts" dominant-baseline="central">Tavily search · dedup by URL · recency gate</text>
<!-- side label -->
<text x="485" y="376" class="ts">List[EvidenceItem]</text>
<text x="485" y="392" class="ts" style="fill:#60a5fa">open_book / hybrid</text>
<line x1="475" y1="386" x2="493" y2="386" class="arr-purple" marker-end="url(#arrow)"/>

<!-- dashed bypass arrow for closed_book -->
<path d="M 200 310 Q 100 310 100 425 Q 100 490 200 490" fill="none" stroke="#4b5563" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
<rect x="38" y="388" width="56" height="22" rx="4" fill="#0c0e14"/>
<text x="66" y="399" text-anchor="middle" class="ts" dominant-baseline="central" style="fill:#4b5563;font-size:10px">skip if</text>
<text x="66" y="411" text-anchor="middle" class="ts" dominant-baseline="central" style="fill:#4b5563;font-size:10px">closed_book</text>

<!-- Arrow down -->
<line x1="340" y1="422" x2="340" y2="446" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     ROW 5: ORCHESTRATOR NODE
     ═══════════════════════════════════════ -->
<rect x="205" y="448" width="270" height="66" rx="12" fill="#14161e" stroke="#8b5cf6" stroke-width="1"/>
<rect x="205" y="448" width="4" height="66" rx="2" fill="#8b5cf6"/>
<text x="228" y="472" class="th" dominant-baseline="central">🎼  Orchestrator Node</text>
<text x="228" y="492" class="ts" dominant-baseline="central">Generates structured blog outline (5–9 sections)</text>
<!-- side label -->
<text x="485" y="468" class="ts">Plan (Pydantic)</text>
<text x="485" y="484" class="ts" style="fill:#a78bfa">tasks, audience, tone</text>
<line x1="475" y1="478" x2="493" y2="478" class="arr-purple" marker-end="url(#arrow)"/>

<!-- Arrow down -->
<line x1="340" y1="514" x2="340" y2="538" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     ROW 6: HITL CHECKPOINT 2
     ═══════════════════════════════════════ -->
<rect x="120" y="540" width="440" height="58" rx="10" fill="#1a140a" stroke="#d97706" stroke-width="1"/>
<rect x="120" y="540" width="440" height="4" rx="2" fill="#d97706"/>
<text x="340" y="567" text-anchor="middle" class="th" dominant-baseline="central" style="fill:#fbbf24">🛑  Checkpoint 2 of 2 — Review Blog Outline</text>
<text x="340" y="586" text-anchor="middle" class="ts" dominant-baseline="central">Approve plan · Regenerate · Review evidence · Add feedback</text>

<!-- Arrow down, fanning into workers -->
<line x1="340" y1="598" x2="340" y2="618" class="arr"/>

<!-- ═══════════════════════════════════════
     ROW 7: LANGGRAPH FAN-OUT LABEL
     ═══════════════════════════════════════ -->
<text x="340" y="635" text-anchor="middle" class="tlabel">LANGGRAPH SEND() API — PARALLEL FAN-OUT</text>

<!-- Fan-out lines to 4 workers -->
<line x1="340" y1="642" x2="110" y2="662" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="340" y1="642" x2="250" y2="662" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="340" y1="642" x2="430" y2="662" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="340" y1="642" x2="570" y2="662" stroke="#4b5563" stroke-width="1" fill="none"/>

<!-- ═══════════════════════════════════════
     ROW 8: WORKER NODES (parallel)
     ═══════════════════════════════════════ -->
<!-- Worker 1 -->
<rect x="60" y="664" width="100" height="68" rx="10" fill="#14161e" stroke="#ec4899" stroke-width="1"/>
<rect x="60" y="664" width="100" height="4" rx="2" fill="#ec4899"/>
<text x="110" y="690" text-anchor="middle" class="th" dominant-baseline="central" style="font-size:12px">Worker 1</text>
<text x="110" y="708" text-anchor="middle" class="ts" dominant-baseline="central">§1 · Intro</text>
<text x="110" y="722" text-anchor="middle" class="ts" dominant-baseline="central">~200 words</text>

<!-- Worker 2 -->
<rect x="200" y="664" width="100" height="68" rx="10" fill="#14161e" stroke="#ec4899" stroke-width="1"/>
<rect x="200" y="664" width="100" height="4" rx="2" fill="#ec4899"/>
<text x="250" y="690" text-anchor="middle" class="th" dominant-baseline="central" style="font-size:12px">Worker 2</text>
<text x="250" y="708" text-anchor="middle" class="ts" dominant-baseline="central">§2 · Core</text>
<text x="250" y="722" text-anchor="middle" class="ts" dominant-baseline="central">~400 words</text>

<!-- Worker 3 (center) -->
<rect x="340" y="664" width="100" height="68" rx="10" fill="#14161e" stroke="#ec4899" stroke-width="1"/>
<rect x="340" y="664" width="100" height="4" rx="2" fill="#ec4899"/>
<text x="390" y="690" text-anchor="middle" class="th" dominant-baseline="central" style="font-size:12px">Worker 3</text>
<text x="390" y="708" text-anchor="middle" class="ts" dominant-baseline="central">§3 · Deep-dive</text>
<text x="390" y="722" text-anchor="middle" class="ts" dominant-baseline="central">~500 words</text>

<!-- Worker N -->
<rect x="480" y="664" width="100" height="68" rx="10" fill="#14161e" stroke="#ec4899" stroke-width="0.75" stroke-dasharray="4 2"/>
<rect x="480" y="664" width="100" height="4" rx="2" fill="#ec4899" opacity="0.5"/>
<text x="530" y="690" text-anchor="middle" class="th" dominant-baseline="central" style="font-size:12px;fill:#9ca3af">Worker N</text>
<text x="530" y="708" text-anchor="middle" class="ts" dominant-baseline="central">§N · Outro</text>
<text x="530" y="722" text-anchor="middle" class="ts" dominant-baseline="central">~150 words</text>

<!-- Fan-in lines from workers -->
<line x1="110" y1="732" x2="310" y2="778" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="250" y1="732" x2="315" y2="778" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="390" y1="732" x2="355" y2="778" stroke="#4b5563" stroke-width="1" fill="none"/>
<line x1="530" y1="732" x2="370" y2="778" stroke="#4b5563" stroke-width="1" fill="none"/>

<!-- FAN-IN label -->
<text x="340" y="762" text-anchor="middle" class="tlabel">FAN-IN — List[(task_id, section_md)]</text>

<!-- ═══════════════════════════════════════
     ROW 9: REDUCER NODE
     ═══════════════════════════════════════ -->
<line x1="340" y1="780" x2="340" y2="800" class="arr" marker-end="url(#arrow)"/>

<rect x="205" y="802" width="270" height="66" rx="12" fill="#14161e" stroke="#10b981" stroke-width="1"/>
<rect x="205" y="802" width="4" height="66" rx="2" fill="#10b981"/>
<text x="228" y="826" class="th" dominant-baseline="central">📝  Reducer Node</text>
<text x="228" y="846" class="ts" dominant-baseline="central">Sort · join · LLM editor polish pass</text>
<!-- side label -->
<text x="485" y="822" class="ts">Markdown string</text>
<text x="485" y="838" class="ts" style="fill:#34d399">final_blog.md</text>
<line x1="475" y1="832" x2="493" y2="832" class="arr-purple" marker-end="url(#arrow)"/>

<!-- Arrow down -->
<line x1="340" y1="868" x2="340" y2="886" class="arr" marker-end="url(#arrow)"/>

<!-- ═══════════════════════════════════════
     OUTPUT PILL
     ═══════════════════════════════════════ -->
<rect x="220" y="888" width="240" height="16" rx="8" fill="#0d2b1f" stroke="#10b981" stroke-width="1"/>
<text x="340" y="896" text-anchor="middle" class="ts" dominant-baseline="central" style="fill:#6ee7b7;font-size:11px">📄  blog.md  ·  Preview + Download in UI</text>

</svg>
